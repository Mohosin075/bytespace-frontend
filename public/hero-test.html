<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Hero Test</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Poppins', sans-serif; }
  .hero {
    background-color: #0445ff;
    background-image: linear-gradient(to right, rgba(255,255,255,0.08) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,0.08) 1px, transparent 1px);
    background-size: 72px 72px;
    min-height: 760px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  nav { display:flex; align-items:center; justify-content:space-between; padding:20px 60px; position:relative; z-index:50; }
  .logo { color:white; font-weight:800; font-size:20px; display:flex; align-items:center; gap:8px; }
  .logo-icon { width:32px; height:32px; background:#cbfc01; border-radius:8px; display:flex; align-items:center; justify-content:center; font-weight:900; color:black; font-size:16px; }
  .nav-links { display:flex; gap:32px; }
  .nav-links a { color:white; text-decoration:none; font-size:15px; }
  .nav-links a.active { font-weight:700; }
  .nav-right { display:flex; align-items:center; gap:20px; color:white; font-size:14px; }
  .join-btn { background:white; color:#0445ff; font-weight:700; padding:8px 20px; border-radius:999px; font-size:14px; cursor:pointer; border:none; }
  .hero-text { text-align:center; position:relative; z-index:20; padding:20px 40px 0; }
  .hero-text h1 { font-size:66px; font-weight:800; color:white; line-height:1.1; letter-spacing:-1px; }
  .hero-text p { margin-top:16px; color:rgba(255,255,255,0.85); font-size:16px; font-weight:400; }
  .search-wrap { max-width:520px; margin:28px auto 0; background:white; border-radius:999px; display:flex; align-items:center; padding:6px 6px 6px 20px; box-shadow:0 8px 40px rgba(0,0,0,0.2); }
  .search-wrap input { flex:1; border:none; outline:none; font-size:14px; color:#333; background:transparent; font-family:inherit; }
  .search-wrap input::placeholder { color:#aaa; }
  .search-btn { background:#cbfc01; color:black; font-weight:700; font-size:14px; padding:10px 28px; border-radius:999px; border:none; cursor:pointer; font-family:inherit; }
  .hero-stage-wrap { position:relative; flex:1; display:flex; justify-content:center; align-items:flex-end; overflow:visible; margin-top:36px; }
  .hero-stage { position:relative; width:940px; height:420px; }
  .lime-circle { position:absolute; width:640px; height:640px; background:#cbfc01; border-radius:50%; left:50%; transform:translateX(-50%); bottom:-320px; z-index:0; }
  .student-wrap { position:absolute; width:360px; height:430px; left:50%; transform:translateX(-50%); bottom:0; z-index:10; }
  .student-wrap img { width:100%; height:100%; object-fit:cover; object-position:top center; border-radius:180px 180px 0 0; display:block; }
  .card { position:absolute; background:white; border-radius:16px; box-shadow:0 8px 32px rgba(0,0,0,0.18); z-index:30; }
  .card-uiux { left:55px; top:105px; padding:14px 20px; min-width:205px; }
  .card-uiux .title { font-size:14px; font-weight:700; color:#111; }
  .card-uiux .sub { font-size:12px; color:#888; margin-top:4px; }
  .card-progress { right:50px; top:90px; padding:14px 20px; min-width:190px; }
  .card-progress .label { font-size:11px; color:#888; font-weight:500; }
  .card-progress .pct { font-size:38px; font-weight:800; color:#111; line-height:1; margin-top:2px; }
  .progress-bar { background:#eee; border-radius:99px; height:6px; margin-top:10px; overflow:hidden; }
  .progress-fill { background:#cbfc01; height:100%; border-radius:99px; width:55%; }
  .card-students { left:70px; bottom:60px; padding:12px 16px; }
  .top-row { display:flex; align-items:center; gap:6px; }
  .hs-title { font-size:12px; font-weight:700; color:#111; }
  .rating { display:flex; align-items:center; gap:2px; font-size:11px; }
  .num { font-weight:700; color:#333; }
  .cnt { color:#aaa; }
  .star { color:#fbbf24; }
  .avatars { display:flex; align-items:center; margin-top:8px; }
  .avatar { width:28px; height:28px; border-radius:50%; border:2px solid white; margin-left:-6px; object-fit:cover; }
  .avatar:first-child { margin-left:0; }
  .avatar-more { width:28px; height:28px; border-radius:50%; background:#cbfc01; color:black; font-size:9px; font-weight:700; display:flex; align-items:center; justify-content:center; border:2px solid white; margin-left:-6px; }
  .shape { position:absolute; pointer-events:none; }
  .shape-lime-blob { top:50px; left:30px; width:140px; height:180px; z-index:10; }
  .shape-wave-left { top:68%; left:11%; width:85px; height:105px; z-index:10; transform:rotate(-12deg); }
  .shape-torus { bottom:0; left:-40px; width:250px; height:250px; z-index:20; transform:rotate(-15deg); }
  .shape-capsule { top:20px; right:30px; width:125px; height:260px; z-index:10; transform:rotate(10deg); }
  .shape-triangle { top:44%; right:11%; width:90px; height:100px; z-index:10; }
  .shape-wave-right { bottom:60px; right:25px; width:110px; height:130px; z-index:20; transform:rotate(10deg); }
</style>
</head>
<body>
<section class="hero">
  <nav>
    <div class="logo"><div class="logo-icon">b</div>ByteSpace</div>
    <div class="nav-links"><a href="#" class="active">Home</a><a href="#">Courses</a><a href="#">Creators</a></div>
    <div class="nav-right"><span>Sign In</span><button class="join-btn">Join Us</button></div>
  </nav>
  <div class="shape shape-lime-blob">
    <svg viewBox="0 0 140 180" fill="none" style="width:100%;height:100%;filter:drop-shadow(0 12px 24px rgba(0,0,0,0.3))">
      <defs><linearGradient id="blob" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#faffc5"/><stop offset="40%" stop-color="#cbfc01"/><stop offset="80%" stop-color="#8cb400"/><stop offset="100%" stop-color="#546b09"/></linearGradient></defs>
      <path d="M 30 20 Q 140 30 110 70 Q 20 110 130 130 Q 30 170 120 170" stroke="url(#blob)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <div class="shape shape-wave-left">
    <svg viewBox="0 0 100 120" fill="none" style="width:100%;height:100%">
      <defs><linearGradient id="wl" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fff"/><stop offset="100%" stop-color="#cbd5e1"/></linearGradient></defs>
      <path d="M 15 20 Q 90 25 70 60 Q 15 95 80 105" stroke="url(#wl)" stroke-width="22" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="shape shape-torus">
    <svg viewBox="0 0 240 240" fill="none" style="width:100%;height:100%">
      <defs><linearGradient id="tor" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fff"/><stop offset="60%" stop-color="#f0f4f8"/><stop offset="100%" stop-color="#cbd5e1"/></linearGradient></defs>
      <path d="M120 16 A104 104 0 1 0 120 224 A104 104 0 1 0 120 16 M120 64 A56 56 0 1 1 120 176 A56 56 0 1 1 120 64" fill="url(#tor)"/>
    </svg>
  </div>
  <div class="shape shape-capsule">
    <svg viewBox="0 0 120 260" fill="none" style="width:100%;height:100%">
      <defs><linearGradient id="cap" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fdffe4"/><stop offset="35%" stop-color="#cbfc01"/><stop offset="75%" stop-color="#8cb400"/><stop offset="100%" stop-color="#465a0d"/></linearGradient></defs>
      <rect x="10" y="10" width="100" height="240" rx="50" fill="url(#cap)"/>
    </svg>
  </div>
  <div class="shape shape-triangle">
    <svg viewBox="0 0 120 140" fill="none" style="width:100%;height:100%">
      <defs><linearGradient id="tr1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fff"/><stop offset="100%" stop-color="#e2e8f0"/></linearGradient><linearGradient id="tr2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#d1d9e8"/><stop offset="100%" stop-color="#94a3b8"/></linearGradient></defs>
      <polygon points="60,8 114,124 60,134" fill="url(#tr1)"/>
      <polygon points="60,8 60,134 6,104" fill="url(#tr2)"/>
    </svg>
  </div>
  <div class="shape shape-wave-right">
    <svg viewBox="0 0 130 160" fill="none" style="width:100%;height:100%">
      <defs><linearGradient id="wr" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fff"/><stop offset="60%" stop-color="#f1f5f9"/><stop offset="100%" stop-color="#cbd5e1"/></linearGradient></defs>
      <path d="M 15 20 Q 120 20 90 70 Q 15 120 115 145" stroke="url(#wr)" stroke-width="26" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="hero-text">
    <h1>Get Access to Hundreds<br>Courses Available</h1>
    <p>Unlock your creativity, gain valuable knowledge, and grow your business with our wide range of courses.</p>
    <div class="search-wrap">
      <svg width="18" height="18" fill="none" stroke="#aaa" stroke-width="2" viewBox="0 0 24 24" style="margin-right:10px;flex-shrink:0"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" placeholder="Course, topic, creator"/>
      <button class="search-btn">Search</button>
    </div>
  </div>
  <div class="hero-stage-wrap">
    <div class="hero-stage">
      <div class="lime-circle"></div>
      <div class="student-wrap"><img src="/hero-student.jpg" alt="Student"/></div>
      <div class="card card-uiux">
        <div class="title">UI/UX Design</div>
        <div class="sub">200 Courses • 1000+ Students</div>
      </div>
      <div class="card card-progress">
        <div class="label">Learning Progress</div>
        <div class="pct">55%</div>
        <div class="progress-bar"><div class="progress-fill"></div></div>
      </div>
      <div class="card card-students">
        <div class="top-row">
          <span class="hs-title">Happy Students</span>
          <div class="rating"><span class="num">4.5</span><span class="cnt">(240)</span><span class="star">★</span></div>
        </div>
        <div class="avatars">
          <img class="avatar" src="https://i.pravatar.cc/40?img=1" alt=""/>
          <img class="avatar" src="https://i.pravatar.cc/40?img=2" alt=""/>
          <img class="avatar" src="https://i.pravatar.cc/40?img=3" alt=""/>
          <img class="avatar" src="https://i.pravatar.cc/40?img=4" alt=""/>
          <img class="avatar" src="https://i.pravatar.cc/40?img=5" alt=""/>
          <div class="avatar-more">2K+</div>
        </div>
      </div>
    </div>
  </div>
</section>
</body>
</html>
